services:
  webapp:
    image: cisia-api:latest
    build: .
    container_name: cisia-api
    ports:
      - "${WEBAPP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      WEBAPP_HOST: 0.0.0.0
      WEBAPP_PORT: 8000
      CISIA_LLM: ${CISIA_LLM:-0}
      RETRAIN_OPTUNA: ${RETRAIN_OPTUNA:-0}
      OPTUNA_TRIALS: ${OPTUNA_TRIALS:-25}
    volumes:
      # Sources immuables (lecture seule) + données de travail (raw/curated/models)
      - ./donnees:/app/donnees:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./docs/registres:/app/docs/registres:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 600s

  retrain:
    image: cisia-api:latest
    build: .
    container_name: cisia-retrain
    entrypoint: ["/app/docker/entrypoint-retrain.sh"]
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      WEBAPP_INTERNAL_URL: http://webapp:8000
      RETRAIN_INTERVAL_SECONDS: ${RETRAIN_INTERVAL_SECONDS:-86400}
      RETRAIN_OPTUNA: ${RETRAIN_OPTUNA:-0}
      OPTUNA_TRIALS: ${OPTUNA_TRIALS:-25}
    volumes:
      - ./donnees:/app/donnees:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./docs/registres:/app/docs/registres:ro
    depends_on:
      webapp:
        condition: service_healthy
    restart: unless-stopped
